<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A minimal personal calendar and school planner.">
<meta name="theme-color" content="#f6f7f9" id="themeColor">

<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default" id="statusBar">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="app.css">
<script>
  /* Runs while the head is still parsing: the theme is in place before the
     first paint, and iOS reads the status-bar style for the dark theme before
     it paints its own (light) bar over a dark app. */
  try {
    var t = localStorage.getItem('planner.theme') === 'dark' ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    document.getElementById('themeColor').content = t === 'dark' ? '#000000' : '#f6f7f9';
    document.getElementById('statusBar').content = t === 'dark' ? 'black' : 'default';
  } catch (e) {}
</script>
</head>
<body>

<header class="topbar">
  <button class="title" id="title" type="button">Calendar</button>
  <div class="topbar-actions">
    <button class="icon-btn" id="prevMonth" type="button" aria-label="Previous month">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon-btn" id="nextMonth" type="button" aria-label="Next month">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="icon-btn" id="syncBtn" type="button" aria-label="Sync">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.4 19H7a4.5 4.5 0 01-.85-8.92 6 6 0 0111.5 1.42A4 4 0 0117.4 19z"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <!-- Calendar -->
  <section class="view" id="view-calendar">
    <div class="cal">
      <div class="cal-week" id="weekdays" aria-hidden="true"></div>
      <div class="cal-grid" id="grid" aria-label="Days"></div>
    </div>
    <div id="agenda"></div>
  </section>

  <!-- Home -->
  <section class="view" id="view-home" hidden></section>

  <!-- Schedule -->
  <section class="view" id="view-schedule" hidden></section>

  <!-- Focus -->
  <section class="view" id="view-focus" hidden></section>

  <!-- Tasks -->
  <section class="view" id="view-tasks" hidden></section>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tab is-active" data-tab="calendar" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="4.8" width="17.6" height="15.4" rx="3"/><path d="M3.2 9.6h17.6M8 3.2v3.2M16 3.2v3.2"/></svg>
    <span>Calendar</span>
  </button>
  <button class="tab" data-tab="schedule" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 2"/></svg>
    <span>Schedule</span>
  </button>
  <button class="tab tab-home" data-tab="home" type="button">
    <span class="home-orb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 10.4 12 3.8l8.4 6.6"/><path d="M5.6 11.9v7.3a1 1 0 0 0 1 1h10.8a1 1 0 0 0 1-1v-7.3"/></svg></span>
    <span>Home</span>
  </button>
  <button class="tab" data-tab="focus" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="3.2"/></svg>
    <span>Focus</span>
  </button>
  <button class="tab" data-tab="tasks" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 7.4l1.9 1.9 3.1-3.4M3.4 16.4l1.9 1.9 3.1-3.4M11.6 7.6h9M11.6 16.6h9"/></svg>
    <span>Tasks</span>
  </button>
</nav>

<div class="lock" id="lock" hidden></div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<script src="bell.js"></script>
<script src="app.js"></script>
</body>
</html>
