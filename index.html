<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A minimal personal calendar and school planner.">
<meta name="theme-color" content="#f6f7f9" id="themeColor">

<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default" id="statusBar">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="app.css">
<script>
  /* Runs while the head is still parsing: the theme is in place before the
     first paint, and iOS reads the status-bar style for the dark theme before
     it paints its own (light) bar over a dark app. */
  try {
    var t = localStorage.getItem('planner.theme') === 'dark' ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    document.getElementById('themeColor').content = t === 'dark' ? '#000000' : '#f6f7f9';
    document.getElementById('statusBar').content = t === 'dark' ? 'black' : 'default';
    /* the style too, before first paint — and its font as early as possible */
    var pr = JSON.parse(localStorage.getItem('planner.prefs.v1') || '{}');
    var nb = pr.style !== 'default';          /* notebook leads now */
    document.documentElement.dataset.style = nb ? 'notebook' : 'default';
    if (nb) {
      var f = document.createElement('link');
      f.id = 'nbFont';
      f.rel = 'stylesheet';
      f.href = 'https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500;700&display=swap';
      document.head.appendChild(f);
    }
  } catch (e) {}
</script>
</head>
<body>

<header class="topbar">
  <button class="title" id="title" type="button">Calendar</button>
  <div class="topbar-actions">
    <button class="icon-btn" id="prevMonth" type="button" aria-label="Previous month">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon-btn" id="nextMonth" type="button" aria-label="Next month">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="icon-btn" id="editBtn" type="button" aria-label="Edit this page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5l4 4L8 20l-4.6 1L4.4 16.4z"/><path d="M13 7l4 4"/></svg>
    </button>
    <button class="icon-btn" id="syncBtn" type="button" aria-label="Sync">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.4 19H7a4.5 4.5 0 01-.85-8.92 6 6 0 0111.5 1.42A4 4 0 0117.4 19z"/></svg>
    </button>
    <button class="icon-btn" id="gearBtn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.3"/><path d="M12 2.6l1.35 2.02 2.4-.62.5 2.42 2.42.5-.62 2.4L20.07 11a10 10 0 010 2l-2.02 1.35.62 2.4-2.42.5-.5 2.42-2.4-.62L12 21.4l-1.35-2.02-2.4.62-.5-2.42-2.42-.5.62-2.4L3.93 13a10 10 0 010-2l2.02-1.35-.62-2.4 2.42-.5.5-2.42 2.4.62z"/></svg>
    </button>
  </div>
</header>


<main id="main"></main>

<nav class="tabbar" id="tabbar"></nav>

<div class="lock" id="lock" hidden></div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

<script src="bell.js"></script>
<script src="app.js"></script>
</body>
</html>
